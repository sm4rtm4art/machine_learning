name: Prototypes CI

on:
  push:
    paths:
      - 'prototypes/**'
  pull_request:
    paths:
      - 'prototypes/**'

env:
  PYTHON_VERSION: "3.13"

jobs:
  light-check:
    name: Light Check (Prototypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Optional: Basic Linting (Non-blocking)
      - name: Run Ruff (Lint)
        continue-on-error: true
        run: uv run ruff check prototypes/ || echo "Linting issues found (non-blocking)"

      # Optional: Basic Formatting Check (Non-blocking)
      - name: Run Ruff (Format)
        continue-on-error: true
        run: uv run ruff format --check prototypes/ || echo "Formatting issues found (non-blocking)"

      # Run tests if they exist in prototypes/
      - name: Run tests in prototypes
        run: |
          if [ -d "prototypes" ]; then
            echo "Checking for tests in prototypes..."
            # Check if there are any test files
            if find prototypes -name "test_*.py" | grep -q .; then
              echo "Tests found, running pytest..."
              uv run pytest prototypes/ -v || exit 1
            else
              echo "No tests found in prototypes. Skipping."
            fi
          else
            echo "prototypes directory not found. Skipping."
          fi
