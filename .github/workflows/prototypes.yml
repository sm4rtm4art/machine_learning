name: Prototypes CI

on:
  push:
    paths:
      - 'projects/vision_ssl_transfer/prototypes/**'
  pull_request:
    paths:
      - 'projects/vision_ssl_transfer/prototypes/**'

env:
  PYTHON_VERSION: "3.13"

jobs:
  light-check:
    name: Light Check (Prototypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Optional: Basic Linting (Non-blocking)
      - name: Run Ruff (Lint)
        continue-on-error: true
        run: uv run ruff check projects/vision_ssl_transfer/prototypes/ || echo "Linting issues found (non-blocking)"

      # Optional: Basic Formatting Check (Non-blocking)
      - name: Run Ruff (Format)
        continue-on-error: true
        run: uv run ruff format --check projects/vision_ssl_transfer/prototypes/ || echo "Formatting issues found (non-blocking)"

      # Run tests if they exist in the prototype directory.
      - name: Run tests in prototypes
        run: |
          PROTOTYPE_DIR="projects/vision_ssl_transfer/prototypes"
          if [ -d "$PROTOTYPE_DIR" ]; then
            echo "Checking for tests in $PROTOTYPE_DIR..."
            # Check if there are any test files
            if find "$PROTOTYPE_DIR" -name "test_*.py" | grep -q .; then
              echo "Tests found, running pytest..."
              uv run pytest "$PROTOTYPE_DIR" -v || exit 1
            else
              echo "No tests found in prototypes. Skipping."
            fi
          else
            echo "prototypes directory not found. Skipping."
          fi
