name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'projects/vision_ssl_transfer/prototypes/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'projects/vision_ssl_transfer/prototypes/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ------------------------------------------------------------------
  # 1. LINTING & FORMATTING (Ruff, Black, etc.)
  # ------------------------------------------------------------------
  pre-commit:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit
        # Führt Checks aus, die in .pre-commit-config.yaml definiert sind
        run: uv run pre-commit run --all-files

  # ------------------------------------------------------------------
  # 2. NOTEBOOK CHECKS (Industry Standard)
  # ------------------------------------------------------------------
  notebook-check:
    name: Notebook Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install nbstripout
        run: uv tool install nbstripout

      # Check if notebooks are clean (no outputs/execution counts)
      # Strategy: run nbstripout and check if it would change anything
      - name: Check for unstripped notebooks
        run: |
          echo "Checking if notebooks are clean (no outputs)..."
          FAILED=0
          for nb in $(find . -name "*.ipynb" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./projects/vision_ssl_transfer/prototypes/*"); do
            # Compare original with stripped version
            if ! diff -q "$nb" <(nbstripout --textconv "$nb") > /dev/null 2>&1; then
              echo "❌ Has outputs: $nb"
              FAILED=1
            else
              echo "✓ Clean: $nb"
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Some notebooks have outputs. Run 'uv run nbstripout <notebook>' to clean them."
            exit 1
          fi
          echo "All notebooks are clean!"

  # ------------------------------------------------------------------
  # 3. TESTS (Pytest & Coverage)
  # ------------------------------------------------------------------
  test:
    name: Unit Tests
    needs: [pre-commit] # Spart Ressourcen: Tests laufen nur, wenn Linting passt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --tb=short -v

      # Optional: Coverage Report
      - name: Run tests with coverage
        run: uv run pytest --cov=src/ml_portfolio --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sm4rtm4art/machine_learning
  # ------------------------------------------------------------------
  # 4. IMPORT CHECK (Sanity Check)
  # ------------------------------------------------------------------
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check imports
        run: |
          uv run python -c "from ml_portfolio.common import config, paths, logging"
          # Füge hier weitere wichtige Imports hinzu, die oft brechen

  # ------------------------------------------------------------------
  # 5. ALL CHECKS (Der "Gatekeeper" für GitHub Settings)
  # ------------------------------------------------------------------
  all-checks:
    name: Status Check
    if: always() # Läuft immer, auch wenn vorher was fehlschlug (um das zu reporten)
    needs: [pre-commit, notebook-check, test, import-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all required jobs
        run: |
          # Wir prüfen manuell, ob einer der 'needs' Jobs fehlgeschlagen ist
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed."
            exit 1
          else
            echo "All checks passed!"
            exit 0
          fi
