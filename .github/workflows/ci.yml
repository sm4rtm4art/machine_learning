name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ------------------------------------------------------------------
  # 1. LINTING & FORMATTING (Ruff, Black, etc.)
  # ------------------------------------------------------------------
  pre-commit:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit
        # Führt Checks aus, die in .pre-commit-config.yaml definiert sind
        run: uv run pre-commit run --all-files

  # ------------------------------------------------------------------
  # 2. NOTEBOOK CHECKS (Industry Standard)
  # ------------------------------------------------------------------
  notebook-check:
    name: Notebook Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Wir installieren nbstripout temporär, um zu prüfen
      - name: Install nbstripout
        run: uv tool install nbstripout

      # PRÜFUNG: Sind die Notebooks "gestripped" (ohne Output)?
      # Das ist viel besser als ein Size-Check. Wenn Outputs drin sind,
      # schlägt dieser Job fehl.
      - name: Check for unstripped notebooks
        run: |
          echo "Checking if notebooks are clean (no outputs)..."
          # Findet alle .ipynb und prüft sie
          uv run nbstripout --is-stripped $(find . -name "*.ipynb")

  # ------------------------------------------------------------------
  # 3. TESTS (Pytest & Coverage)
  # ------------------------------------------------------------------
  test:
    name: Unit Tests
    needs: [pre-commit] # Spart Ressourcen: Tests laufen nur, wenn Linting passt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --tb=short -v

      # Optional: Coverage Report
      - name: Run tests with coverage
        run: uv run pytest --cov=src/ml_portfolio --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ------------------------------------------------------------------
  # 4. IMPORT CHECK (Sanity Check)
  # ------------------------------------------------------------------
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check imports
        run: |
          uv run python -c "from ml_portfolio.common import config, paths, logging"
          # Füge hier weitere wichtige Imports hinzu, die oft brechen

  # ------------------------------------------------------------------
  # 5. ALL CHECKS (Der "Gatekeeper" für GitHub Settings)
  # ------------------------------------------------------------------
  all-checks:
    name: Status Check
    if: always() # Läuft immer, auch wenn vorher was fehlschlug (um das zu reporten)
    needs: [pre-commit, notebook-check, test, import-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all required jobs
        run: |
          # Wir prüfen manuell, ob einer der 'needs' Jobs fehlgeschlagen ist
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed."
            exit 1
          else
            echo "All checks passed!"
            exit 0
