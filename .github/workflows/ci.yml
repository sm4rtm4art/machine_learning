name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff linter
        run: uv run ruff check src/ projects/

      - name: Run ruff formatter check
        run: uv run ruff format --check src/ projects/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --tb=short -v

      - name: Run tests with coverage
        run: uv run pytest --cov=src/ml_portfolio --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  notebook-check:
    name: Notebook Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check notebook outputs
        run: |
          # Find notebooks with large outputs
          for nb in $(find projects -name "*.ipynb" 2>/dev/null); do
            size=$(wc -c < "$nb")
            if [ "$size" -gt 100000 ]; then
              echo "::error file=$nb::Notebook exceeds 100KB. Please strip outputs."
              exit 1
            fi
          done
          echo "All notebooks within size limits"

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check imports
        run: |
          # Verify all project modules can be imported
          uv run python -c "from ml_portfolio.common import config, paths, logging"
          uv run python -c "from ml_portfolio.metrics import classification, regression, ocr"
          uv run python -c "from ml_portfolio.eval import slicing"
          uv run python -c "from ml_portfolio.tracking import mlflow_utils"

          # Check project modules (non-model imports)
          uv run python -c "from projects.ocr_pipeline.project import preprocess, postprocess"

  all-checks:
    name: All Checks
    needs: [pre-commit, lint, typecheck, test, notebook-check, import-check]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed!"
