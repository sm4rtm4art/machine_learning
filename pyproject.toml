[project]
name = "ml-portfolio"
version = "0.1.0"
description = "Machine Learning Portfolio - a work-in-progress collection of Python ML projects and evaluation patterns"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "Martin" }]
keywords = ["machine-learning", "deep-learning", "mlops", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML/Data
    "numpy>=2.4.5",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "torch>=2.12.0",
    "torchvision>=0.24.1",
    "transformers>=5.8.1",
    # Experiment tracking
    "mlflow>=3.11.1",
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.7.0",
    # Utilities
    "python-dotenv>=1.2.2",
    "structlog>=24.1.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.2.1",
]

[project.optional-dependencies]
ocr = [
    "pillow>=12.2.0",
    "opencv-python>=4.9.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.17.0",
    "jiwer>=3.0.0",  # WER/CER metrics
    "datasets>=2.16.0",  # HuggingFace datasets
    "torchvision>=0.17.0",  # Required for Qwen2-VL
    "einops>=0.7.0",  # Required for Florence-2
    "timm>=0.9.0",  # Required for Florence-2
]
vision = [
    "pillow>=12.2.0",
    "torchvision>=0.17.0",
    "albumentations>=1.3.0",
]
tabular = [
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.5.0",
    # SHAP depends on numba/llvmlite, which frequently lags newest Python releases.
    # Keep it optional on Python 3.13+ so `uv sync --all-extras` works in CI.
    "shap>=0.44.0; python_version < '3.13'",
]
timeseries = [
    # Darts currently pulls in SHAP → numba/llvmlite which can lag newest Python.
    # Keep it optional on Python 3.13+ so `uv sync --all-extras` works in CI.
    "darts>=0.27.0; python_version < '3.13'",
    "statsmodels>=0.14.0",
]
serving = [
    "fastapi>=0.109.0",
    "uvicorn>=0.47.0",
    "httpx>=0.26.0",
]
monitoring = [
    "evidently>=0.7.21",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.13",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-PyYAML",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.5.7",
    "nbstripout>=0.7.0",
]
all = [
    "ml-portfolio[ocr,vision,tabular,timeseries,serving,monitoring,dev]",
]

[project.urls]
Repository = "https://github.com/sm4rtm4art/machine_learning"
Documentation = "https://github.com/sm4rtm4art/machine_learning#readme"

[project.scripts]
ml-portfolio = "ml_portfolio.common.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_portfolio"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.13",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "projects"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
    "SIM108", # allow explicit if/else assignments for readability
]

[tool.ruff.lint.isort]
known-first-party = ["ml_portfolio"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"projects/*/scripts/*.py" = ["ARG001"]
# Notebooks are interactive artifacts; keep them formatted, but relax strict lint rules that
# conflict with common notebook patterns (imports after setup, widget callbacks, etc.).
"**/*.ipynb" = ["E402", "E722", "ARG001", "W293"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "torch.*",
    "transformers.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
    "cv2.*",
    "PIL.*",
    "onnx.*",
    "onnxruntime.*",
    "hydra.*",
    "omegaconf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src", "projects"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
