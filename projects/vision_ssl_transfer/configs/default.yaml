# Vision SSL Transfer - Default Configuration
# Self-supervised learning with explainability focus

project:
  name: vision_ssl_transfer
  version: "0.1.0"
  description: "SSL pretraining with SHAP explainability"

# =============================================================================
# SSL Pretraining Configuration
# =============================================================================
ssl:
  # Algorithm: simclr, moco_v3, mae, dino
  algorithm: simclr

  # Backbone architecture
  backbone: vit_small_patch16_224  # timm model name

  # SimCLR specific
  simclr:
    temperature: 0.5
    projection_dim: 128
    projection_hidden_dim: 2048

  # MAE specific
  mae:
    mask_ratio: 0.75
    decoder_dim: 512
    decoder_depth: 8

  # Training
  batch_size: 256
  epochs: 100
  learning_rate: 3.0e-4
  weight_decay: 1.0e-6
  warmup_epochs: 10

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Dataset: oxford_pets, tortoise_custom
  dataset: oxford_pets

  # Paths (relative to data/ directory)
  data_dir: null  # Auto-resolved to data/vision_ssl_transfer/

  # Image settings
  image_size: 224

  # Augmentation strength for SSL
  augmentation:
    # SimCLR-style augmentations
    color_jitter: 0.8
    grayscale_prob: 0.2
    gaussian_blur_prob: 0.5
    horizontal_flip_prob: 0.5

  # Split configuration (for labeled subset)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42

# =============================================================================
# Transfer/Fine-tuning Configuration
# =============================================================================
transfer:
  # Evaluation methods
  methods:
    - linear_probe   # Freeze backbone, train linear head
    - knn            # k-Nearest Neighbors (no training)
    - fine_tune      # Full fine-tuning

  # Linear probe settings
  linear_probe:
    epochs: 50
    learning_rate: 1.0e-3
    batch_size: 64

  # k-NN settings
  knn:
    k: 20
    temperature: 0.07

  # Fine-tuning settings
  fine_tune:
    epochs: 20
    learning_rate: 1.0e-5
    batch_size: 32
    freeze_backbone_epochs: 5  # Freeze backbone for first N epochs

# =============================================================================
# Explainability Configuration
# =============================================================================
explainability:
  # SHAP settings
  shap:
    method: deep  # deep, gradient, kernel
    n_samples: 100
    max_evals: 500

  # Attention visualization
  attention:
    head_fusion: mean  # mean, max, min
    discard_ratio: 0.9

  # Latent space visualization
  umap:
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

# =============================================================================
# Robustness Evaluation
# =============================================================================
robustness:
  corruptions:
    - name: gaussian_noise
      severities: [1, 3, 5]
    - name: blur
      severities: [1, 3, 5]
    - name: contrast
      severities: [1, 3, 5]
    - name: occlusion
      severities: [0.1, 0.2, 0.3]  # Fraction of image occluded

# =============================================================================
# MLflow Configuration
# =============================================================================
mlflow:
  experiment_name: vision_ssl_transfer
  run_name: null  # Auto-generated if null
  tracking_uri: null  # Uses default from env

# =============================================================================
# Export Configuration
# =============================================================================
export:
  format: onnx
  quantize: false
  optimize: true
  opset_version: 17

# =============================================================================
# Logging & Reproducibility
# =============================================================================
logging:
  level: INFO
  format: console

seed: 42
device: auto  # auto, cuda, mps, cpu
